name: CI

"on":
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# Cancel superseded runs on the same branch/PR instead of piling them up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; neither job needs write access to anything.
permissions:
  contents: read

jobs:
  cmake:
    name: CMake (GCC 13, C++23)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install GCC 13
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13

      # Ubuntu 24.04's own apt package (3.28.x) already satisfies the
      # project's CMake >= 3.21 requirement, so this step isn't working
      # around an insufficient default -- it pins the exact documented
      # minimum deliberately, so a green run here actually verifies that
      # floor rather than whatever newer version happens to be preinstalled.
      - name: Install CMake >= 3.21
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.21.0"

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_CXX_COMPILER=g++-13
          -DCMAKE_C_COMPILER=gcc-13

      - name: Build
        run: cmake --build build -j

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  bazel:
    name: Bazel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: bazel build //...

      # Includes the per-header standalone-compilation test suite
      # (cc_header_compilation_suite), which is the mechanism referenced in
      # the README's "Testing & quality" section.
      - name: Test
        run: bazel test //...
