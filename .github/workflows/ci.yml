name: CI

"on":
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# Cancel superseded runs on the same branch/PR instead of piling them up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; neither job needs write access to anything.
permissions:
  contents: read

jobs:
  cmake:
    name: CMake ${{ matrix.cmake-version }} (GCC 13, C++23)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Floor (the documented minimum), latest 3.x, and latest overall.
        # Compiler is held fixed at the documented floor (GCC 13) across all
        # three -- compiler-version and build-system-version compatibility
        # are largely independent concerns here, and crossing every CMake
        # version with every GCC version would be combinatorial cost for
        # very little extra signal.
        cmake-version: [ "~3.21.0", "~3.31.0", "latest" ]
    steps:
      - uses: actions/checkout@v5

      - name: Install GCC 13
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13

      # Ubuntu 24.04's own apt package (3.28.x) already satisfies the
      # project's CMake >= 3.21 requirement, so this step isn't working
      # around an insufficient default -- it pins each matrix version
      # deliberately, so these runs actually verify the documented floor
      # and the current releases rather than whatever happens to be
      # preinstalled on the runner.
      - name: Install CMake (${{ matrix.cmake-version }})
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ matrix.cmake-version }}

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_CXX_COMPILER=g++-13
          -DCMAKE_C_COMPILER=gcc-13

      - name: Build
        run: cmake --build build -j

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  bazel:
    name: Bazel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: bazel build //...

      # Includes the per-header standalone-compilation test suite
      # (cc_header_compilation_suite), which is the mechanism referenced in
      # the README's "Testing & quality" section.
      - name: Test
        run: bazel test //...
